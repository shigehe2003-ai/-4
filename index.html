<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>究極・石割りゲーム</title>

<style>
body {
  text-align: center;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #1a1a1a;
  color: white;
  margin: 0;
  padding: 20px;
  overflow: hidden;
  user-select: none;
}

h1 { color: #aaa; text-shadow: 2px 2px 0px #000; }

/* 石のデザイン：CSSだけで作成（画像不要） */
#stone-container {
  perspective: 1000px;
  margin: 50px auto;
  width: 220px;
}

#stone {
  width: 220px;
  height: 200px;
  background: radial-gradient(circle at 30% 30%, #888, #444);
  box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 20px 30px rgba(0,0,0,0.8);
  clip-path: polygon(
    20% 5%, 85% 0%, 100% 45%, 90% 90%,
    40% 100%, 5% 75%, 0% 35%
  );
  cursor: pointer;
  position: relative;
  transition: transform 0.05s linear;
}

/* 叩いた時のアニメーション */
.shake { animation: shake 0.1s irritation infinite; }
@keyframes shake {
  0% { transform: translate(2px, 1px) rotate(0deg); }
  50% { transform: translate(-1px, -2px) rotate(-1deg); }
  100% { transform: translate(1px, 2px) rotate(1deg); }
}

/* クリティカル時のエフェクト */
.critical {
  filter: brightness(2) contrast(1.5) !important;
  transform: scale(1.1) !important;
}

/* ステータス表示 */
.stats-container {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 10px;
  display: inline-block;
  margin-top: 20px;
}
.stat-item { margin: 5px 20px; display: inline-block; }
.label { font-size: 0.8em; color: #888; display: block; }
.value { font-size: 1.2em; font-weight: bold; color: #ffd700; }

button {
  background: #444;
  color: white;
  border: none;
  padding: 12px 25px;
  font-size: 1em;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 20px;
  transition: 0.2s;
}
button:hover { background: #666; }
button:active { transform: scale(0.95); }
button:disabled { opacity: 0.3; cursor: not-allowed; }

/* ヒビの代わりにオーバーレイでダメージを表現 */
#damage-overlay {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(0,0,0,0.2) 10px, rgba(0,0,0,0.2) 11px);
  opacity: 0;
  pointer-events: none;
}
</style>
</head>
<body>

<h1>⛏ ULTIMATE STONE BREAKER</h1>

<div id="stone-container">
  <div id="stone">
    <div id="damage-overlay"></div>
  </div>
</div>

<div class="stats-container">
  <div class="stat-item"><span class="label">HP</span><span id="hp" class="value">-</span></div>
  <div class="stat-item"><span class="label">POWER</span><span id="power" class="value">-</span></div>
  <div class="stat-item"><span class="label">SCORE</span><span id="score" class="value">-</span></div>
</div>

<br>
<button id="upgradeBtn" onclick="upgrade()">強化 (10)</button>

<script>
let maxHp = 20;
let hp = maxHp;
let power = 1;
let score = 0;
let upgradeCost = 10;

const stone = document.getElementById("stone");
const overlay = document.getElementById("damage-overlay");
const upgradeBtn = document.getElementById("upgradeBtn");

function update() {
  document.getElementById("hp").textContent = `${Math.ceil(hp)} / ${maxHp}`;
  document.getElementById("power").textContent = power;
  document.getElementById("score").textContent = score;
  upgradeBtn.textContent = `強化 (Cost: ${upgradeCost})`;
  upgradeBtn.disabled = score < upgradeCost;

  // ダメージに応じて石を黒く、線を濃くする
  const damageRatio = 1 - (hp / maxHp);
  overlay.style.opacity = damageRatio;
  stone.style.filter = `brightness(${1 - damageRatio * 0.5})`;
}

stone.onclick = function() {
  // クリティカル判定 (10%の確率)
  const isCritical = Math.random() < 0.1;
  const currentDamage = isCritical ? power * 3 : power;

  hp -= currentDamage;

  // 演出：揺らす
  stone.classList.add('shake');
  if (isCritical) stone.classList.add('critical');

  setTimeout(() => {
    stone.classList.remove('shake');
    stone.classList.remove('critical');
  }, 100);

  if (hp <= 0) {
    score += Math.floor(maxHp / 2);
    maxHp = Math.floor(maxHp * 1.4);
    hp = maxHp;
    alert("💥 見事に石を砕いた！スコア獲得！");
  }

  update();
};

function upgrade() {
  if (score >= upgradeCost) {
    score -= upgradeCost;
    power++;
    upgradeCost = Math.floor(upgradeCost * 1.6); // コスト上昇
    update();
  }
}

// 初期化
update();
</script>

</body>
</html>
