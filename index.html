<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>究極・石割りゲーム</title>

<style>
body {
  text-align: center;
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #1a1a1a;
  color: white;
  user-select: none; /* テキスト選択を防止 */
}

/* 石のスタイル */
#stone-container {
  perspective: 1000px;
  margin: 40px auto;
  width: 220px;
}

#stone {
  width: 220px;
  height: 200px;
  background: linear-gradient(145deg, #888, #333);
  clip-path: polygon(20% 0%, 85% 2%, 100% 40%, 90% 95%, 25% 100%, 5% 75%, 0% 25%);
  position: relative;
  cursor: pointer;
  transition: transform 0.05s, filter 0.05s;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* クリック時のアニメーション */
.shake {
  animation: shake 0.1s linear;
}

@keyframes shake {
  0% { transform: translate(2px, 1px) rotate(0deg); }
  20% { transform: translate(-1px, -2px) rotate(-1deg); }
  40% { transform: translate(-3px, 0px) rotate(1deg); }
